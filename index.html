<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="referrer" content="no-referrer" />
  <title>Notre Ludothèque</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-hover: #26354d;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-2: #818cf8;
      --success: #22c55e;
      --warning: #f59e0b;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: 40px;
      line-height: 1.45;
    }

    header {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      padding: 18px 16px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1100px;
      margin: 0 auto 12px auto;
    }

    h1 { font-size: 1.35rem; font-weight: 800; letter-spacing: -0.02em; }
    .count-badge {
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .controls {
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 8px;
    }

    input, select, button {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 0.9rem;
      outline: none;
    }

    input:focus, select:focus { border-color: var(--accent); }

    .btn-random {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #0f172a;
      font-weight: 700;
      border: none;
      cursor: pointer;
    }

    main {
      max-width: 1100px;
      margin: 18px auto;
      padding: 0 14px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 14px;
    }

    .game-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      gap: 14px;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .game-card:hover {
      background: var(--card-hover);
      transform: translateY(-2px);
    }

    .game-thumb {
      width: 78px;
      height: 78px;
      border-radius: 10px;
      object-fit: contain;
      background: #0b1120;
      flex-shrink: 0;
      border: 1px solid var(--border);
    }

    .game-info { flex: 1; min-width: 0; }
    .game-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 4px;
      color: #fff;
    }

    .game-type {
      font-size: 0.78rem;
      color: var(--accent);
      margin-bottom: 6px;
      font-weight: 500;
    }

    .game-desc-preview {
      font-size: 0.82rem;
      color: #cbd5e1;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .badge {
      font-size: 0.72rem;
      padding: 3px 7px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.07);
      color: var(--muted);
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.82);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }

    .modal-overlay.active { display: flex; }

    .modal {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      max-width: 650px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 20px;
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 14px;
      right: 14px;
      background: rgba(255,255,255,0.08);
      border: none;
      color: var(--text);
      width: 34px;
      height: 34px;
      border-radius: 50%;
      font-size: 1.1rem;
      cursor: pointer;
    }

    .goal-box {
      background: rgba(56, 189, 248, 0.1);
      border-left: 4px solid var(--accent);
      padding: 12px 14px;
      border-radius: 8px;
      margin: 14px 0;
    }

    .goal-title {
      font-weight: 700;
      font-size: 0.88rem;
      color: var(--accent);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .step-box {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
    }

    .step-title {
      font-weight: 700;
      font-size: 0.85rem;
      color: var(--warning);
      margin-bottom: 4px;
    }

    .links-row {
      display: flex;
      gap: 10px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .btn-link {
      flex: 1;
      text-align: center;
      text-decoration: none;
      padding: 10px 14px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.9rem;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .score-section {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    .score-input-row {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .score-input-row input { flex: 1; }
    .btn-save {
      background: var(--success);
      color: #052e16;
      font-weight: 700;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-top">
      <h1>🎲 Notre Ludothèque</h1>
      <span id="gameCount" class="count-badge">Chargement...</span>
    </div>
    <div class="controls">
      <input type="text" id="searchInput" placeholder="Rechercher un jeu..." oninput="renderGames()" />
      <select id="playerFilter" onchange="renderGames()">
        <option value="">👥 Joueurs (Tous)</option>
        <option value="1">1 joueur</option>
        <option value="2">2 joueurs</option>
        <option value="3">3 joueurs</option>
        <option value="4">4 joueurs</option>
        <option value="5">5 joueurs</option>
        <option value="6">6+ joueurs</option>
      </select>
      <select id="ageFilter" onchange="renderGames()">
        <option value="">🎂 Âge (Tous)</option>
        <option value="4">Dès 4 ans</option>
        <option value="6">Dès 6 ans</option>
        <option value="8">Dès 8 ans</option>
        <option value="10">Dès 10 ans</option>
      </select>
      <select id="timeFilter" onchange="renderGames()">
        <option value="">⏱️ Durée max</option>
        <option value="15">≤ 15 min</option>
        <option value="30">≤ 30 min</option>
        <option value="45">≤ 45 min</option>
      </select>
      <select id="fatigueFilter" onchange="renderGames()">
        <option value="">🧠 Fatigue (Toutes)</option>
        <option value="Apéro">Apéro</option>
        <option value="Léger">Léger</option>
        <option value="Stratégique">Stratégique</option>
      </select>
      <button class="btn-random" onclick="pickRandomGame()">🎲 Au hasard</button>
    </div>
  </header>

  <main id="gamesGrid"></main>

  <div id="modalOverlay" class="modal-overlay" onclick="if(event.target===this) closeModal()">
    <div class="modal" id="modalContent"></div>
  </div>

  <script>
    const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTDTCTLj-hkq0Mi924uG-PkmFnpBcHkdGqEFUsZHeoamH_JqV-g7h5efCZc21bA4fl-jHTvQLCA3iaN/pub?gid=0&single=true&output=csv";
    const SCRIPT_URL = "https://script.goo" + "gle.com/macros/s/AKfycbyO3t70lKLZ_uAkvYJcuvEMT11qk-QhoCvJfN3Prt5RGeT5vbRXiYtDNbp2bbq4JSeb1Q/exec";

    let allGames = [];

    function parseCSV(text) {
      const rows = [];
      let row = [], cur = "", inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i], next = text[i + 1];
        if (inQuotes) {
          if (c === '"' && next === '"') { cur += '"'; i++; }
          else if (c === '"') { inQuotes = false; }
          else { cur += c; }
        } else {
          if (c === '"') { inQuotes = true; }
          else if (c === ',') { row.push(cur.trim()); cur = ""; }
          else if (c === '\n' || (c === '\r' && next === '\n')) {
            row.push(cur.trim());
            if (row.some(cell => cell !== "")) rows.push(row);
            row = []; cur = "";
            if (c === '\r') i++;
          } else { cur += c; }
        }
      }
      if (cur || row.length) {
        row.push(cur.trim());
        if (row.some(cell => cell !== "")) rows.push(row);
      }
      return rows;
    }

    async function loadFromGoogleSheet() {
      try {
        const res = await fetch(SHEET_CSV_URL + "&t=" + Date.now());
        const csvText = await res.text();
        const rows = parseCSV(csvText);
        const headers = rows[0];

        allGames = rows.slice(1).map(r => {
          const obj = {};
          headers.forEach((h, idx) => obj[h] = r[idx] || "");
          return {
            nom: obj["Nom"] || r[0] || "",
            min: parseInt(obj["Joueurs_Min"] || r[1]) || 1,
            max: parseInt(obj["Joueurs_Max"] || r[2]) || 99,
            ideal: obj["Joueurs_Ideal"] || r[3] || "",
            duree: parseInt(obj["Duree_Min"] || r[4]) || 0,
            setupTime: obj["Temps_Setup"] || r[5] || "1",
            type: obj["Type"] || r[6] || "",
            fatigue: obj["Fatigue"] || r[7] || "",
            interaction: obj["Interaction"] || r[8] || "",
            encombrement: obj["Encombrement"] || r[9] || "",
            setupCommun: obj["Setup_Commun"] || r[10] || "",
            setupJoueur: obj["Setup_Par_Joueur"] || r[11] || "",
            premierTour: obj["Premier_Tour"] || r[12] || "",
            regles: obj["Lien_Regles"] || r[13] || "",
            video: obj["Lien_Video"] || r[14] || "",
            age: obj["Age_Min"] || r[15] || "",
            image: obj["Image_URL"] || r[16] || "",
            scores: obj["Meilleurs_Scores"] || r[17] || "",
            description: obj["Description_But"] || r[18] || ""
          };
        }).filter(g => g.nom);

        renderGames();
      } catch (err) {
        document.getElementById("gameCount").textContent = "Erreur de chargement";
        console.error(err);
      }
    }

    function getFilteredGames() {
      const q = document.getElementById("searchInput").value.toLowerCase();
      const p = parseInt(document.getElementById("playerFilter").value);
      const a = parseInt(document.getElementById("ageFilter").value);
      const t = parseInt(document.getElementById("timeFilter").value);
      const f = document.getElementById("fatigueFilter").value;

      return allGames.filter(g => {
        if (q && !g.nom.toLowerCase().includes(q) && !g.type.toLowerCase().includes(q) && !g.description.toLowerCase().includes(q)) return false;
        if (p) {
          if (p === 6 && g.max < 6) return false;
          if (p < 6 && (p < g.min || p > g.max)) return false;
        }
        if (a) {
          const gameAge = parseInt(g.age) || 0;
          if (gameAge > a) return false;
        }
        if (t && g.duree > t) return false;
        if (f && g.fatigue.toLowerCase() !== f.toLowerCase()) return false;
        return true;
      });
    }

    function renderGames() {
      const list = getFilteredGames();
      document.getElementById("gameCount").textContent = `${list.length} jeu${list.length > 1 ? 'x' : ''}`;
      const grid = document.getElementById("gamesGrid");

      grid.innerHTML = list.map(g => `
        <div class="game-card" onclick="openModal('${g.nom.replace(/'/g, "\\'")}')">
          <img class="game-thumb" src="${g.image || 'https://via.placeholder.com/80?text=Jeu'}" alt="${g.nom}" referrerpolicy="no-referrer" onerror="this.src='https://via.placeholder.com/80?text=Jeu'" />
          <div class="game-info">
            <div class="game-title">${g.nom}</div>
            <div class="game-type">${g.type}</div>
            ${g.description ? `<p class="game-desc-preview">🎯 ${g.description}</p>` : ''}
            <div class="badges">
              <span class="badge">👥 ${g.min}-${g.max} j.</span>
              <span class="badge">⏱️ ${g.duree} min</span>
              <span class="badge">🛠️ Setup ${g.setupTime}m</span>
              <span class="badge">🧠 ${g.fatigue}</span>
              ${g.age ? `<span class="badge">🎂 ${g.age}</span>` : ''}
            </div>
          </div>
        </div>
      `).join("");
    }

    function openModal(gameName) {
      const g = allGames.find(item => item.nom === gameName);
      if (!g) return;

      const content = document.getElementById("modalContent");
      content.innerHTML = `
        <button class="modal-close" onclick="closeModal()">✕</button>
        <h2 style="margin-bottom:4px;">${g.nom}</h2>
        <div class="game-type" style="margin-bottom:10px;">${g.type} • Idéal : ${g.ideal} • Âge : ${g.age || 'Tous'}</div>

        ${g.description ? `
          <div class="goal-box">
            <div class="goal-title">🎯 Description & But du jeu</div>
            <p>${g.description}</p>
          </div>
        ` : ''}

        <div class="step-box">
          <div class="step-title">1. Mise en place commune (${g.setupTime} min)</div>
          <p>${g.setupCommun || 'Aucune préparation spéciale.'}</p>
        </div>

        <div class="step-box">
          <div class="step-title">2. Mise en place par joueur</div>
          <p>${g.setupJoueur || 'Aucun matériel individuel.'}</p>
        </div>

        <div class="step-box">
          <div class="step-title">3. Premier tour</div>
          <p>${g.premierTour || 'Le plus jeune joueur commence.'}</p>
        </div>

        <div class="links-row">
          ${g.regles ? `<a class="btn-link" href="${g.regles}" target="_blank" rel="noopener">📄 Livret de règles (PDF)</a>` : ''}
          ${g.video ? `<a class="btn-link" href="${g.video}" target="_blank" rel="noopener">🎬 Vidéo explicative</a>` : ''}
        </div>

        <div class="score-section">
          <div class="step-title">🏆 Meilleurs Scores / Records</div>
          <div class="score-input-row">
            <input type="text" id="scoreInput" value="${g.scores.replace(/"/g, '&quot;')}" placeholder="Ex: Isabelle : 85 pts | Sam : 78 pts" />
            <button class="btn-save" onclick="saveScore('${g.nom.replace(/'/g, "\\'")}')">Enregistrer</button>
          </div>
          <small id="scoreStatus" style="color:var(--muted); display:block; margin-top:6px;"></small>
        </div>
      `;

      document.getElementById("modalOverlay").classList.add("active");
    }

    function closeModal() {
      document.getElementById("modalOverlay").classList.remove("active");
    }

    function pickRandomGame() {
      const list = getFilteredGames();
      if (!list.length) return;
      const chosen = list[Math.floor(Math.random() * list.length)];
      openModal(chosen.nom);
    }

    async function saveScore(gameName) {
      const val = document.getElementById("scoreInput").value;
      const status = document.getElementById("scoreStatus");
      status.textContent = "Sauvegarde en cours...";
      try {
        const url = `${SCRIPT_URL}?action=score&nom=${encodeURIComponent(gameName)}&scores=${encodeURIComponent(val)}`;
        await fetch(url, { mode: "no-cors" });
        const g = allGames.find(item => item.nom === gameName);
        if (g) g.scores = val;
        status.textContent = "✅ Record enregistré dans Google Sheets !";
      } catch (e) {
        status.textContent = "❌ Erreur lors de la sauvegarde.";
      }
    }

    loadFromGoogleSheet();
  </script>
</body>
</html>
